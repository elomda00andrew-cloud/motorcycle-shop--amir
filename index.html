<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض نادي صبري للموتوسيكلات - تسجيل الدخول</title>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        h2 {
            font-size: 20px;
            color: #0f172a;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: left;
            direction: ltr;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #15803d;
        }
        .error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>معرض نادي صبري للموتوسيكلات 🔐</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="andrew2emad12@gmail.com" required>
            <input type="password" id="password" placeholder="••••••••" required>
            <button type="submit">دخول</button>
        </form>
        <div id="errorMessage" class="error"></div>
    </div>

    <script>
        // إعدادات الربط مع مشروع Supabase باستخدام مفتاح anon الصحيح
        const supabaseUrl = 'https://byrkgnqkovmsepbpknyc.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ5cmtnbnFrb3Ztc2VwYnBrbnljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNDcyNjIsImV4cCI6MjEwMTkyMzI2Mn0.brTfe8HPjGTg53_4bDdZMM6be7QlmNfxvNSd-sIwXLw';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMessage.innerText = '';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            try {
                const { data, error } = await supabaseClient
                    .from('users')
                    .select('*')
                    .eq('email', email)
                    .eq('password', password)
                    .maybeSingle();

                if (error) {
                    console.error('Supabase Error:', error);
                    errorMessage.innerText = 'حدث خطأ في الاتصال بقاعدة البيانات';
                    return;
                }

                if (!data) {
                    errorMessage.innerText = 'اسم المستخدم أو كلمة المرور غير صحيحة';
                    return;
                }

                // عند نجاح عملية تسجيل الدخول
                alert('تم تسجيل الدخول بنجاح!');
                // window.location.href = 'dashboard.html';

            } catch (err) {
                console.error(err);
                errorMessage.innerText = 'تعذر الاتصال بالخادم';
            }
        });
    </script>
</body>
</html>
